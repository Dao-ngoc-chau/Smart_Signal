<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 LORA DASHBOARD</title>
    <style>
        /* --- HIỆU ỨNG LỐC XOÁY TOÀN TRANG --- */
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;

<body>

<div class="container">
    <div class="box-title">ESP32 LoRa Dashboard</div>
    
    <div class="sub-section-title">Thời gian chu kỳ hệ thống</div>
    <input id="input-time" class="input-field" style="text-align: center; font-size: 1.8rem; font-weight: bold; color: #ff9800;" placeholder="Thời gian..." min="1" value="00:00:00 00/00/0000" readonly>

    <div class="sub-section-title">Địa Chỉ MAC (Tự động lưu)</div>
    <select id="mac-list-dropdown" class="input-field" style="font-size: 1.1rem; font-weight: bold; color: #00ff66;">
        <option value="">-- ĐANG TẢI DANH SÁCH MAC --</option>
    </select>

    <hr style="border: 0; border-top: 1px solid #333; margin: 25px 0;">

    <div class="sub-section-title">Cập nhật ứng dụng hệ thống (OTA)</div>
    <input type="file" id="file-input" class="input-field" accept=".bin">
    <button id="btn-submit-update" class="btn-nc" onclick="batDauUploadFirmware()">Bắt đầu nạp firmware</button>
    
    <div id="prg-container">
        <div id="prg-bar">0%</div>
    </div>
</div>

<script>
    var websocket;
    
    // TỰ ĐỘNG BẮT ĐÚNG GIAO THỨC WS / WSS ĐỂ CHỐNG LỖI BẢO MẬT HTTPS
    function khoiTaoWebsocket() {
        var giaoThucProtocol = (window.location.protocol === 'https:') ? 'wss://' : 'ws://';
        var duongDanWs = giaoThucProtocol + window.location.hostname + '/ws';
        
        console.log("[WEBSOCKET] Kết nối tới: " + duongDanWs);
        websocket = new WebSocket(duongDanWs);
        
        websocket.onmessage = function(event) {
            var data = JSON.parse(event.data);
            
            // 1. Cập nhật ô hiển thị thời gian số lớn
            if (data.time !== undefined) {
                document.getElementById('input-time').value = data.time;
            }
            
            // 2. Xử lý danh sách MAC và đồng bộ hóa MAC mặc định chữ hoa
            if (data.mac_list !== undefined && Array.isArray(data.mac_list)) {
                var dropdown = document.getElementById('mac-list-dropdown');
                var macMacDinh = (data.mac_default !== undefined) ? data.mac_default.toUpperCase().trim() : "";
                
                dropdown.innerHTML = '<option value="">-- DANH SÁCH MAC --</option>';
                
                data.mac_list.forEach(function(macStr) {
                    var macChuanHoa = macStr.toUpperCase().trim();
                    var opt = document.createElement('option');
                    opt.value = macChuanHoa;
                    opt.textContent = "Mac: " + macChuanHoa;
                    
                    if (macChuanHoa === macMacDinh) {
                        opt.selected = true;
                    }
                    dropdown.appendChild(opt);
                });
            }
        };
        
        websocket.onclose = function() {
            setTimeout(khoiTaoWebsocket, 2000); // Tự kết nối lại sau 2 giây nếu rớt
        };
    }

    // Khởi chạy khi tải xong trang
    window.onload = function() {
        khoiTaoWebsocket();
    };

    // TRÌNH XỬ LÝ NẠP FILE TỐC ĐỘ CAO CHUYỂN LOG NGẦM
    function batDauUploadFirmware() {
        let fileInput = document.getElementById('file-input');
        if (fileInput.files.length === 0) {
            alert("Vui lòng chọn file .bin trước khi nạp!");
            return;
        }
        
        if (!confirm("Bạn có chắc muốn nạp Firmware này? Mạch sẽ tự reboot sau khi hoàn tất.")) return;
        
        let file = fileInput.files[0];
        let formData = new FormData();
        formData.append("update", file, file.name); 

        document.getElementById('prg-container').style.display = 'block';
        let prgBar = document.getElementById('prg-bar');
        let btnSubmit = document.getElementById('btn-submit-update');
        btnSubmit.disabled = true;
        btnSubmit.style.opacity = "0.5";
        
        let xhr = new XMLHttpRequest();
        xhr.open("POST", "/flash", true); 
        
        // Theo dõi tiến trình tải lên từ phía Client
        xhr.upload.addEventListener("progress", function(e) {
            if (e.lengthComputable) {
                let percentage = Math.round((e.loaded / e.total) * 100);
                if(percentage >= 100) {
                    prgBar.style.width = "100%";
                    prgBar.style.backgroundColor = "#ff9800"; // Chuyển màu cam khi đẩy hết file thô lên mạng
                    prgBar.innerText = "Đang chốt bộ nhớ... (Vui lòng chờ)";
                } else {
                    prgBar.style.width = percentage + "%";
                    prgBar.innerText = percentage + "%";
                }
            }
        });
        
        // Trả phản hồi thành công ngay khi ESP32 nhận xong dữ liệu
        xhr.onload = function() {
            if (xhr.status === 200) {
                XửLýThànhCôngOta();
            } else {
                XửLýThấtBạiOta(xhr.responseText);
            }
        };

        // Đề phòng mạch ngắt kết nối quá nhanh để xử lý lưu phân vùng ngầm
        xhr.onerror = function() {
            if (prgBar.style.backgroundColor === "rgb(255, 152, 0)") {
                XửLýThànhCôngOta();
            } else {
                XửLýThấtBạiOta("Mất kết nối với thiết bị");
            }
        };
        
        function XửLýThànhCôngOta() {
            prgBar.style.backgroundColor = '#00ff66'; // Màu xanh lá rực rỡ báo xong
            prgBar.style.color = '#000';
            prgBar.innerText = "NẠP THÀNH CÔNG! REBOOT...";
            
            setTimeout(function() {
                alert("Nâng cấp thành công! Hệ thống đang tự khởi động lại. Bấm OK để tự động làm mới trang sau 5 giây.");
                setTimeout(function() {
                    window.location.reload(); // Tự động F5 làm mới trang
                }, 5000); 
            }, 500);
        }

        function XửLýThấtBạiOta(errorText) {
            prgBar.style.backgroundColor = '#ff3333';
            prgBar.style.color = '#fff';
            prgBar.innerText = "LỖI NẠP FILE!";
            alert("Lỗi: " + (errorText || "Thiết bị không phản hồi"));
            btnSubmit.disabled = false;
            btnSubmit.style.opacity = "1";
        }

        xhr.send(formData);
    }
</script>
</body>
</html>
